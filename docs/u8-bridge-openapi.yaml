openapi: 3.0.3
info:
  title: U8 Bridge REST API
  version: 0.1.0
  description: >
    REST contract exposed by the Windows-hosted U8 Bridge service. The Bridge
    is the only integration boundary for U8; business systems must not connect
    to the U8 database directly. Implemented endpoints call official U8 APIs
    through U8Login and U8ApiBroker. Public integrations should use
    /api/u8/<business-resource>/<action> strong typed endpoints such as
    /api/u8/sales-order/save. Generated official API aliases are exposed as migrated
    /api/u8/<business-resource>/<action> paths with x-u8-official-api
    traceability. Legacy /api/u8/official/... remains available only for
    compatibility/internal diagnostics. Read endpoints are
    exposed through the same Bridge boundary and use the Bridge-owned read-only
    U8 database config.
servers:
  - url: http://u8-bridge-host:8081
    description: U8 Bridge server
security:
  - ApiKeyAuth: []
tags:
  - name: "系统"
    description: "Bridge 进程健康、文档和 U8 登录环境验证。"
  - name: "主数据查询"
    description: "通过 Bridge 只读 U8 数据库查询客户、供应商、存货、价格等基础资料。"
  - name: "库存查询"
    description: "通过 Bridge 只读 U8 数据库查询现存量等库存状态。"
  - name: "采购查询"
    description: "通过 Bridge 只读 U8 数据库查询采购在途等采购状态。"
  - name: "生产制造-BOM"
    description: "对接官方生产制造物料清单 U8 API，并提供只读参数查询。"
