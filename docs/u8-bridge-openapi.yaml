openapi: 3.0.3
info:
  title: U8 Bridge REST API
  version: 0.1.0
  description: >
    REST contract exposed by the Windows-hosted U8 Bridge service. The Bridge
    is the only integration boundary for U8; business systems must not connect
    to the U8 database directly. Implemented endpoints call official U8 APIs
    through U8Login and U8ApiBroker. Read endpoints are exposed through the
    same Bridge boundary and use the Bridge-owned read-only U8 database config.
servers:
  - url: http://u8-bridge-host:8081
    description: U8 Bridge server
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Bridge process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleResponse"
  /swagger:
    get:
      summary: Swagger UI for this OpenAPI contract
      security: []
      responses:
        "200":
          description: Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string
  /api/u8/login-test:
    post:
      summary: Test U8 login profile
      operationId: loginTest
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTestRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/customers/query:
    post:
      summary: Query U8 customer master data
      description: Reads U8 customer master data from the Bridge-owned read-only U8 database config.
      operationId: queryCustomers
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        $ref: "#/components/requestBodies/MasterQueryRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "400":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/materials/query:
    post:
      summary: Query U8 material master data
      description: Reads U8 material master data from the Bridge-owned read-only U8 database config.
      operationId: queryMaterials
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        $ref: "#/components/requestBodies/MasterQueryRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "400":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/suppliers/query:
    post:
      summary: Query U8 supplier master data
      description: Reads U8 supplier master data from the Bridge-owned read-only U8 database config.
      operationId: querySuppliers
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        $ref: "#/components/requestBodies/MasterQueryRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "400":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/inventory/query:
    post:
      summary: Query U8 inventory balance
      description: Reads U8 current stock data from the Bridge-owned read-only U8 database config.
      operationId: queryInventory
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryQueryRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "400":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/in-transit/query:
    post:
      summary: Query U8 purchase in-transit data
      description: Reads U8 purchase in-transit data from the Bridge-owned read-only U8 database config.
      operationId: queryInTransit
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InTransitQueryRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "400":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-price/query:
    post:
      summary: Query U8 material price
      description: Reads U8 material reference price fields from the Bridge-owned read-only U8 database config.
      operationId: queryMaterialPrice
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialPriceQueryRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "400":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/sales-order/save:
    post:
      summary: Create or update U8 sales order
      operationId: saveSalesOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrderSaveRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "400":
          $ref: "#/components/responses/BridgeResponse"
        "409":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
        "503":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/sales-order/audit:
    post:
      summary: Audit or unaudit U8 sales order
      operationId: auditSalesOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/consignment/save:
    post:
      summary: Create or update U8 sales consignment document
      operationId: saveConsignment
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsignmentSaveRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/consignment/audit:
    post:
      summary: Audit or unaudit U8 sales consignment document
      operationId: auditConsignment
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/saleout/add:
    post:
      summary: Create U8 sales outbound document
      operationId: addSaleOut
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleOutAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "409":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/saleout/audit:
    post:
      summary: Audit U8 sales outbound document
      operationId: auditSaleOut
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-out/add:
    post:
      summary: Create U8 material outbound document
      operationId: addMaterialOut
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialOutAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-out/audit:
    post:
      summary: Audit U8 material outbound document
      description: Calls U8API/MaterialOut/Audit from the official material outbound sample.
      operationId: auditMaterialOut
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-out/cancel-audit:
    post:
      summary: Cancel audit for U8 material outbound document
      operationId: cancelAuditMaterialOut
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-out/delete:
    post:
      summary: Delete U8 material outbound document
      operationId: deleteMaterialOut
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-app/add:
    post:
      summary: Create U8 material application document
      operationId: addMaterialApp
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialAppAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-app/audit:
    post:
      summary: Audit U8 material application document
      operationId: auditMaterialApp
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/morder/add:
    post:
      summary: Create U8 manufacture order
      description: Calls U8API/MOrder/MOrderAdd with the official extbo structure.
      operationId: addManufactureOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufactureOrderAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/morder/update:
    post:
      summary: Update U8 manufacture order
      operationId: updateManufactureOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufactureOrderAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/morder/audit:
    post:
      summary: Audit U8 manufacture order
      operationId: auditManufactureOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufactureOrderAuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/morder/unaudit:
    post:
      summary: Cancel audit for U8 manufacture order
      operationId: unauditManufactureOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufactureOrderSimpleRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/morder/delete:
    post:
      summary: Delete U8 manufacture order
      operationId: deleteManufactureOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufactureOrderSimpleRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/morder/load:
    post:
      summary: Load U8 manufacture order
      operationId: loadManufactureOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufactureOrderSimpleRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/purchase-order/confirm:
    post:
      summary: Confirm U8 purchase order
      operationId: confirmPurchaseOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderConfirmRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/purchase-order/cancel-confirm:
    post:
      summary: Cancel confirmation for U8 purchase order
      operationId: cancelConfirmPurchaseOrder
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderConfirmRequest"
      responses:
        "200":
          $ref: "#/components/responses/BridgeResponse"
        "422":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/inbound/add:
    post:
      summary: Create U8 inbound document
      description: Unified Bridge API shell. Returns U8_API_NOT_SUPPORTED until official U8 inbound sample is provided.
      operationId: addInbound
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundAddRequest"
      responses:
        "400":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/production-plan/publish:
    post:
      summary: Publish production plan to U8
      description: Unified Bridge API shell. Returns U8_API_NOT_SUPPORTED until official production plan sample is provided.
      operationId: publishProductionPlan
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionPlanPublishRequest"
      responses:
        "400":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/work-report/save:
    post:
      summary: Save production work report to U8
      description: Unified Bridge API shell. Returns U8_API_NOT_SUPPORTED until official work report sample is provided.
      operationId: saveWorkReport
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkReportSaveRequest"
      responses:
        "400":
          $ref: "#/components/responses/BridgeResponse"
  /api/u8/material-return/add:
    post:
      summary: Create U8 production material return document
      description: Unified Bridge API shell. Returns U8_API_NOT_SUPPORTED until official material return sample is provided.
      operationId: addMaterialReturn
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialReturnAddRequest"
      responses:
        "400":
          $ref: "#/components/responses/BridgeResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
      description: Global request correlation id.
  requestBodies:
    MasterQueryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MasterQueryRequest"
  responses:
    BridgeResponse:
      description: Standard Bridge response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BridgeResponse"
  schemas:
    SimpleResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    BridgeResponse:
      type: object
      required: [success, requestId]
      properties:
        success:
          type: boolean
        requestId:
          type: string
        u8Code:
          type: string
          nullable: true
        u8Id:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
          enum:
            - AUTH_MISSING
            - AUTH_INVALID
            - SOURCE_FORBIDDEN
            - REQUEST_INVALID
            - REQUEST_ID_MISMATCH
            - LOGIN_PROFILE_NOT_FOUND
            - U8_LOGIN_FAILED
            - U8_COMPONENT_UNAVAILABLE
            - U8_DATABASE_ERROR
            - U8_API_NOT_SUPPORTED
            - U8_SYS_ERROR
            - U8_BIZ_ERROR
            - U8_RESULT_FAILED
            - U8_RESPONSE_PARSE_ERROR
            - IDEMPOTENCY_CONFLICT
            - IDEMPOTENCY_RECORD_LOCKED
            - BRIDGE_TIMEOUT
            - BRIDGE_INTERNAL_ERROR
        rawMessage:
          type: string
          nullable: true
        data:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/QueryResult"
            - type: object
    QueryResult:
      type: object
      properties:
        pageNo:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    LoginTestRequest:
      type: object
      required: [requestId, profileName]
      properties:
        requestId:
          type: string
        profileName:
          type: string
    BaseBusinessRequest:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
        profileName:
          type: string
          default: prod-100
    MasterQueryRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          properties:
            updatedFrom:
              type: string
              format: date-time
            updatedTo:
              type: string
              format: date-time
            keyword:
              type: string
            pageNo:
              type: integer
              default: 1
            pageSize:
              type: integer
              default: 200
    InventoryQueryRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          properties:
            warehouseCode:
              type: string
            materialCode:
              type: string
            batchNo:
              type: string
            asOfDate:
              type: string
              format: date
            pageNo:
              type: integer
              default: 1
            pageSize:
              type: integer
              default: 200
    InTransitQueryRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          properties:
            supplierCode:
              type: string
            materialCode:
              type: string
            dateFrom:
              type: string
              format: date
            dateTo:
              type: string
              format: date
            pageNo:
              type: integer
              default: 1
            pageSize:
              type: integer
              default: 200
    MaterialPriceQueryRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          properties:
            materialCode:
              type: string
            customerCode:
              type: string
            supplierCode:
              type: string
            priceDate:
              type: string
              format: date
    SalesOrderSaveRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          required: [orderNo, orderDate, customerCode, departmentCode, salesTypeCode, maker, items]
          properties:
            orderNo:
              type: string
            orderDate:
              type: string
              format: date
            customerCode:
              type: string
            customerName:
              type: string
            departmentCode:
              type: string
            departmentName:
              type: string
            salesTypeCode:
              type: string
            salesTypeName:
              type: string
            maker:
              type: string
            currency:
              type: string
              default: 人民币
            taxRate:
              type: number
              format: decimal
            autoAudit:
              type: boolean
              default: false
            memo:
              type: string
            items:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SalesOrderItem"
    SalesOrderItem:
      type: object
      required: [lineNo, materialCode, quantity, unit, deliveryDate]
      properties:
        lineNo:
          type: integer
          minimum: 1
        materialCode:
          type: string
        materialName:
          type: string
        specification:
          type: string
        quantity:
          type: number
          format: decimal
        unit:
          type: string
        unitCode:
          type: string
        deliveryDate:
          type: string
          format: date
        taxUnitPrice:
          type: number
          format: decimal
        taxAmount:
          type: number
          format: decimal
    AuditRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          required: [verify]
          properties:
            orderNo:
              type: string
            deliveryNo:
              type: string
            outboundNo:
              type: string
            u8Id:
              type: string
            verify:
              type: boolean
            verifier:
              type: string
            businessType:
              type: string
              default: 普通采购
    ConsignmentSaveRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          required: [deliveryNo, deliveryDate, customerCode, maker, items]
          properties:
            deliveryNo:
              type: string
            orderNo:
              type: string
            deliveryDate:
              type: string
              format: date
            customerCode:
              type: string
            customerName:
              type: string
            departmentCode:
              type: string
            salesTypeCode:
              type: string
            maker:
              type: string
            autoAudit:
              type: boolean
              default: false
            memo:
              type: string
            items:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/OutboundItem"
    SaleOutAddRequest:
      allOf:
        - $ref: "#/components/schemas/BaseBusinessRequest"
        - type: object
          required: [outboundNo, outboundDate, customerCode, warehouseCode, maker, items]
          properties:
            outboundNo:
              type: string
            orderNo:
              type: string
            outboundDate:
              type: string
              format: date
            customerCode:
              type: string
            customerName:
              type: string
            warehouseCode:
              type: string
            warehouseName:
              type: string
            departmentCode:
              type: string
            rdCode:
              type: string
            maker:
              type: string
            autoAudit:
              type: boolean
              default: false
            memo:
              type: string
            items:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/OutboundItem"
    MaterialOutAddRequest:
